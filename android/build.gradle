buildscript {
    repositories {
        google()  // Use Google’s Maven repository for updated Android tools
        mavenCentral()
    }

    dependencies {
        // Update to the latest stable version of Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:7.0.4'  // Latest version (you can verify from official docs)
        classpath 'com.facebook.react:react-native-gradle-plugin:0.71.0'  // Update this according to your React Native version
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33  // Update to latest compile SDK version
    buildToolsVersion "33.0.0"  // Update to latest build tools version

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 33  // Update to latest target SDK version
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()  // Always ensure Google’s repository is included
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation "com.android.billingclient:billing:7.0.0"  // Update to the latest version of Billing Client
}